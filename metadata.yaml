name: astrbot_plugin_linghui_studio
display_name: 灵绘工坊
desc: 带受控群白名单、独立无限额度名单、多渠道自动回退与原生协议适配、会话级模型/渠道切换、可追溯图生图输入原图与五套持久化主题 Dashboard 的 AstrBot 文生图/图生图插件。
help: |
  灵绘工坊
  #画 <提示词>：自定义绘图；带图片时为图生图，无图片时为文生图。
  #bnn [@用户 ...] <提示词>：自定义绘图；可按艾特顺序使用一个或多个 QQ 头像，并自动禁止把艾特名称、群名、QQ 号或 ID 画进图片。
  #文生图 <提示词>：显式文生图。
  #头像图生图 <提示词>：使用发送者 QQ 头像作为参考图。
  #<预设名> [追加要求]：调用预设，例如 #手办化。
  #签到 / #额度：签到与额度查询。
  #通道 [ID/序号/自动]：查看或切换本会话绘图渠道；加“全局”二字才改全局默认（管理员）。
  #模型 [模型名]：查看或切换本会话绘图模型；加“全局”二字才改全局默认（管理员）。
  #帮助：查看完整命令说明。

  需要与其他插件共存时，在 Dashboard 设置命名空间并关闭直接命令；例如 #绘图 文生图 <提示词>、#绘图 bnn <提示词>。

  上面示例里的 # 是 AstrBot 顶层设置里的“唤醒词”(wake_prefix)，不是插件自带的前缀。
  若你的唤醒词不是 #，请把示例中的 # 换成你的唤醒词，或在 Dashboard 的唤醒词列表里追加一个 #（可与原有唤醒词并存）。
  也可以直接 @机器人 后接命令，或在私聊里不带唤醒词使用。
version: v3.8.2
author: Whereis-Alice
repo: https://github.com/Whereis-Alice/astrbot_plugin_linghui_studio
astrbot_version: ">=4.16,<5"
